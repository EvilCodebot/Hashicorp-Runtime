events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stdout info;

    upstream backend {
        server VM_B_IP:443;
    }

    # HTTP server
    server {
        listen 10000;
        
        location / {
            proxy_pass https://backend;
            
            # TLS configuration for upstream (VM B)
            proxy_ssl_certificate /etc/nginx/certs/vm-a.crt;
            proxy_ssl_certificate_key /etc/nginx/certs/vm-a.key;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 1;
            # Enable SNI and set expected hostname for SSL validation
            proxy_ssl_server_name on;
            proxy_ssl_name vm-b.internal;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server
    server {
        listen 10443 ssl;
        
        # Server certificate and key
        ssl_certificate /etc/nginx/certs/vm-a.crt;
        ssl_certificate_key /etc/nginx/certs/vm-a.key;
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        
        location / {
            proxy_pass https://backend;
            
            # TLS configuration for upstream (VM B)
            proxy_ssl_certificate /etc/nginx/certs/vm-a.crt;
            proxy_ssl_certificate_key /etc/nginx/certs/vm-a.key;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 1;
            # Enable SNI and set expected hostname for SSL validation
            proxy_ssl_server_name on;
            proxy_ssl_name vm-b.internal;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
} 